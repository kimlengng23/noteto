services:
  api:
    build: ./noteto-api
    ports:
      - "3001:3000"
    environment:
      CONN_STR: mongodb://mongodb:27017
      DB_NAME: Noteto
      DEFAULT_DB_NAME: Noteto
      SECURED_PORT: 3000
      JWT_SECRET: change-this-development-secret
    depends_on:
      mongodb:
        condition: service_healthy

  ui:
    build: ./noteto-ui
    ports:
      - "8080:8080"
    environment:
      VUE_APP_PROXY_TARGET: http://api:3000
    depends_on:
      - api

  mongodb:
    image: mongo:7
    volumes:
      - noteto-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  noteto-mongodb-data:
